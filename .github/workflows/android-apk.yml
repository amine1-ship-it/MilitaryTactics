name: Build Military Tactics APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MilitaryTactics-source.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: '17'
      ANDROID_COMPILE_SDK: '29'
      ANDROID_BUILD_TOOLS: '29.0.3'
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$ANDROID_SDK_ROOT"

          if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Installing Android cmdline-tools..."
            cd "$ANDROID_SDK_ROOT"

            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
            rm -rf cmdline-tools
            mkdir -p cmdline-tools

            unzip -q cmdline-tools.zip -d cmdline-tools-tmp
            mv cmdline-tools-tmp/cmdline-tools/* cmdline-tools/ || true
            rm -rf cmdline-tools-tmp cmdline-tools.zip
          fi

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-29" \
            "build-tools;29.0.3"

      - name: Extract project from zip
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f "MilitaryTactics-source.zip" ]; then
            echo "MilitaryTactics-source.zip not found in repository root"
            ls -la
            exit 1
          fi

          rm -rf extracted
          unzip -q "MilitaryTactics-source.zip" -d extracted

          PROJECT_DIR=""
          while IFS= read -r candidate; do
            dir="$(dirname "$candidate")"
            if [ -f "$dir/gradlew" ] || [ -f "$dir/settings.gradle" ] || [ -f "$dir/app/build.gradle" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done < <(find extracted -type f \( -name "build.gradle" -o -name "settings.gradle" \) 2>/dev/null)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not locate Android project directory inside the zip."
            find extracted -maxdepth 6 -print | head -n 200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project dir: $PROJECT_DIR"

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail

          cd "$PROJECT_DIR"

          if [ ! -f "gradlew" ]; then
            echo "gradlew not found in project directory: $PROJECT_DIR"
            find .. -maxdepth 5 -name gradlew -print || true
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MilitaryTactics-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
