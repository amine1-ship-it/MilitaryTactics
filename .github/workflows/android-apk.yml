name: Build Military Tactics APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MilitaryTactics-source.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: '17'
      ANDROID_COMPILE_SDK: '29'
      ANDROID_BUILD_TOOLS: '29.0.3'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is empty after setup."
            exit 1
          fi

          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "sdkmanager not found in PATH. Installing cmdline-tools..."
            yes | sdkmanager --install "cmdline-tools;latest" || true
          fi

          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "sdkmanager still not found in PATH after installation."
            ls -la "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" || true
            exit 1
          fi

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --install \
            "cmdline-tools;latest" \
            "platform-tools" \
            "platforms;android-29" \
            "build-tools;29.0.3"

      - name: Extract project from zip
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f "MilitaryTactics-source.zip" ]; then
            echo "MilitaryTactics-source.zip not found in repository root"
            ls -la
            exit 1
          fi

          rm -rf extracted
          unzip -q "MilitaryTactics-source.zip" -d extracted

          PROJECT_DIR=""
          while IFS= read -r candidate; do
            dir="$(dirname "$candidate")"
            if [ -f "$dir/gradlew" ] || [ -f "$dir/settings.gradle" ] || [ -f "$dir/app/build.gradle" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done < <(find extracted -type f \( -name "build.gradle" -o -name "settings.gradle" \) 2>/dev/null)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not locate Android project directory inside the zip."
            find extracted -maxdepth 6 -print | head -n 200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project dir: $PROJECT_DIR"

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail

          cd "$PROJECT_DIR"

          if [ ! -f "gradlew" ]; then
            echo "gradlew not found in project directory: $PROJECT_DIR"
            find .. -maxdepth 5 -name gradlew -print || true
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MilitaryTactics-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
