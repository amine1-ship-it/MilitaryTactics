name: Build Military Tactics APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MilitaryTactics-source.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          yes | sdkmanager --licenses || true

          sdkmanager --install "cmdline-tools;latest" "platform-tools" "platforms;android-29" "build-tools;29.0.3"

      - name: Extract project
        shell: bash
        run: |
          set -euxo pipefail

          unzip -q MilitaryTactics-source.zip -d extracted

          PROJECT_DIR=$(find extracted -type f -path "*/app/build.gradle" | head -n 1 | xargs dirname 2>/dev/null)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find Android project directory inside the zip."
            find extracted -maxdepth 5 -print | head -n 200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          test -f "$PROJECT_DIR/app/build.gradle"

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail

          cd "$PROJECT_DIR"

          if [ ! -f "gradlew" ]; then
            echo "gradlew not found in project directory: $PROJECT_DIR"
            find .. -maxdepth 5 -name gradlew -print
            exit 1
          fi

          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MilitaryTactics-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
